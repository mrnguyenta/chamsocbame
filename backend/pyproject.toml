[project]
name = "chamsoc"
version = "0.1.0"
description = "Theo dõi sức khoẻ ba mẹ từ Garmin, báo về Telegram"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.17",
    "curl_cffi>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "anthropic>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["chamsoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
